<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optify Industrial Solutions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Portrait Mode Blocker -->
  <div id="portraitBlocker" class="portrait-blocker">
    <div class="blocker-content">
      <p>Please rotate your device to landscape mode</p>
      <svg class="rotation-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M 50 30 L 50 70" stroke="currentColor" stroke-width="2"/>
        <path d="M 50 70 L 40 60" stroke="currentColor" stroke-width="2"/>
        <path d="M 50 70 L 60 60" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <!-- Main Application Container -->
  <div id="appContainer" class="app-container">
    
    <!-- PAGE 1: LANDING PAGE -->
    <div id="page1" class="page page-1 active">
      <div class="landing-content">
        <div class="landing-layout">
          <!-- Line 1: Welcome to -->
          <div class="welcome-line">
            <div class="section-title">Welcome to</div>
          </div>
          
          <!-- Line 2: Optify Industrial + List + Solutions -->
          <div class="main-line">
            <div class="section-title">Optify Industrial</div>
            <div class="scroll-container" id="scrollContainer">
              <div class="scroll-list" id="scrollList">
                <!-- List items will be generated by JavaScript -->
              </div>
            </div>
            <div class="section-title">Solutions</div>
          </div>
        </div>
      </div>
      <button id="nextPageIndicator1" class="next-page-indicator hidden" type="button" aria-label="Go to next page">
        <span class="indicator-text">Next Page</span>
        <span class="indicator-arrow">↓</span>
      </button>
    </div>

    <!-- PAGE 2: INTRO TEXT -->
    <div id="page2" class="page page-2">
      <div class="intro-container">
        <p id="introText" class="intro-text"></p>
      </div>
      <button id="nextPageIndicator2" class="next-page-indicator hidden" type="button" aria-label="Go to next page">
        <span class="indicator-text">Next Page</span>
        <span class="indicator-arrow">↓</span>
      </button>
    </div>

    <!-- PAGE 3: USER SELECTION -->
    <div id="page3" class="page page-3">
      <div class="selection-header">
        <h2>Tell me about you?</h2>
      </div>
      <div class="selection-grid">
        <button class="selection-button" data-product="Rice">Rice</button>
        <button class="selection-button" data-product="Corn">Corn</button>
        <button class="selection-button" data-product="Wheat">Wheat</button>
        <button class="selection-button" data-product="Cattle">Cattle</button>
        <button class="selection-button" data-product="Poultry">Poultry</button>
        <button class="selection-button" data-product="Aqua">Aqua</button>
      </div>
    </div>

    <!-- SUB-PAGES -->
    <div id="subPagesContainer" class="sub-pages-container hidden">
      <!-- Template for sub-pages (Rice, Corn, Wheat, Cattle, Poultry, Aqua) -->
      <div id="subPageTemplate" class="sub-page" style="display: none;">
        <div class="sub-page-layout">
          <!-- Left Tab Bar -->
          <div class="tab-bar">
            <button class="tab-button" data-tab="1">Tab 1</button>
            <button class="tab-button" data-tab="2">Tab 2</button>
            <button class="tab-button" data-tab="3">Tab 3</button>
            <button class="tab-button" data-tab="4">Tab 4</button>
          </div>

          <!-- Right Content Panel -->
          <div class="content-panel">
            <div class="tab-content" data-tab="1">
              <div class="carousel">
                <div class="carousel-images">
                  <div class="carousel-image">Image 1</div>
                  <div class="carousel-image">Image 2</div>
                  <div class="carousel-image">Image 3</div>
                  <div class="carousel-image">Image 4</div>
                </div>
                <div class="carousel-indicators">
                  <span class="indicator">●</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                </div>
                <div class="carousel-controls">
                  <button class="carousel-prev">◀</button>
                  <button class="carousel-next">▶</button>
                </div>
              </div>
            </div>

            <div class="tab-content" data-tab="2">
              <div class="carousel">
                <div class="carousel-images">
                  <div class="carousel-image">Image 1</div>
                  <div class="carousel-image">Image 2</div>
                  <div class="carousel-image">Image 3</div>
                  <div class="carousel-image">Image 4</div>
                </div>
                <div class="carousel-indicators">
                  <span class="indicator">●</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                </div>
                <div class="carousel-controls">
                  <button class="carousel-prev">◀</button>
                  <button class="carousel-next">▶</button>
                </div>
              </div>
            </div>

            <div class="tab-content" data-tab="3">
              <div class="carousel">
                <div class="carousel-images">
                  <div class="carousel-image">Image 1</div>
                  <div class="carousel-image">Image 2</div>
                  <div class="carousel-image">Image 3</div>
                  <div class="carousel-image">Image 4</div>
                </div>
                <div class="carousel-indicators">
                  <span class="indicator">●</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                </div>
                <div class="carousel-controls">
                  <button class="carousel-prev">◀</button>
                  <button class="carousel-next">▶</button>
                </div>
              </div>
            </div>

            <div class="tab-content" data-tab="4">
              <div class="carousel">
                <div class="carousel-images">
                  <div class="carousel-image">Image 1</div>
                  <div class="carousel-image">Image 2</div>
                  <div class="carousel-image">Image 3</div>
                  <div class="carousel-placeholder">Contact Us</div>
                </div>
                <div class="carousel-indicators">
                  <span class="indicator">●</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                  <span class="indicator">○</span>
                </div>
                <div class="carousel-controls">
                  <button class="carousel-prev">◀</button>
                  <button class="carousel-next">▶</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Generated sub-pages will be inserted here -->
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
